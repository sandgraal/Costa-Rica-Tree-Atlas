name: Content & Build Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "content/**/*.mdx"
      - "src/components/mdx/**"
      - "contentlayer.config.ts"
      - "src/**/*.tsx"
      - "src/**/*.ts"
      - "messages/**"
      - "i18n/**"
      - ".github/workflows/content-build-tests.yml"
      - ".github/actions/setup-node/**"

  workflow_dispatch:
concurrency:
  group: content-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-validation:
    name: Validate Content & Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-node
        with:
          prisma: "true"

      - name: Build Contentlayer
        run: npm run contentlayer
        continue-on-error: false

      # Runs the WHOLE suite, not four named files.
      #
      # This step used to invoke exactly four test files by name. Everything
      # else — all of tests/security/ (including the EXIF GPS strip guard that
      # protects protected-species locations from poaching disclosure), all of
      # tests/api/, tests/lib/, tests/theme/ and i18n-parity — never ran on a
      # pull request, despite tests/CLAUDE.md stating "Tests run in
      # content-build-tests.yml on every PR". Two test files were in fact
      # failing on main under that arrangement.
      - name: Run test suite
        run: npm run test:run

      - name: Run factual accuracy audit (local checks)
        run: npm run content:fact-audit -- --skip-external

      - name: Check ES depth parity (80% floor)
        run: npm run content:es-parity-check

      # Fails the PR when the plan's dashboard no longer matches the corpus.
      # The scheduled update-metrics workflow silently no-op'd for months while
      # every doc drifted from 175 species to 180; a gate on the PR is what
      # actually catches that.
      - name: Check implementation-plan metrics are current
        run: node scripts/update-implementation-metrics.mjs --check

      - name: Type check
        run: npm run type-check

      - name: Build Next.js
        run: npm run build
        env:
          # Ensure build fails on errors, not just warnings
          CI: true

      - name: Check build output
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed - .next directory not created"
            exit 1
          fi
          echo "✅ Build completed successfully"

      - name: Report summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Contentlayer validation passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Content validation tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MDX component tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tree MDX component registry validation passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Route-level regression tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Factual accuracy audit passed (local checks)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ES depth parity check passed (80% floor)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type checking passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Next.js build succeeded" >> $GITHUB_STEP_SUMMARY
