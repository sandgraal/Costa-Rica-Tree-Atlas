name: Security Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "middleware.ts"
      - "next.config.ts"
      - "prisma/**"
      - "contentlayer.config.ts"
      - ".github/workflows/security.yml"
      - ".github/actions/**"
  schedule:
    # Full security sweep every Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # LIGHTWEIGHT JOBS — always on PRs; some also run on schedule/manual
  # ──────────────────────────────────────────────

  # NPM Audit - Check for vulnerable dependencies
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-node

      # Uses the wrapper, not bare `npm audit`. The wrapper fails on any
      # unaccepted high/critical production advisory and carries a short, dated,
      # justified exception list — see scripts/audit-production-deps.mjs. A bare
      # `npm audit --audit-level=high` exits 1 on advisories with no available
      # fix, which left this gate permanently red.
      - name: Run production dependency audit
        run: npm run security:audit

  # Secret Scanning - Detect committed secrets
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: HEAD
          extra_args: --only-verified

  # ──────────────────────────────────────────────
  # ANALYSIS JOBS
  #
  # These were gated `if: github.event_name != 'pull_request'`, i.e. they ran on
  # schedule and manual dispatch only. docs/IMPLEMENTATION_PLAN.md's own risk
  # table records that this pairing — a required status check that never runs on
  # PRs — silently blocked the merge of #755. A security check that cannot see a
  # pull request is not a gate; it is a report you read after the fact.
  # ──────────────────────────────────────────────

  # CodeQL Analysis - Static Application Security Testing (SAST)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    #
    # ⚠️ Results are NOT in the Security tab. See "Restoring upload" below.
    #
    # The analysis runs and passes; only the SARIF *upload* is rejected, because
    # Code Scanning is not enabled for this repository:
    #
    #   "Code scanning is not enabled for this repository.
    #    Please enable code scanning in the repository settings."
    #
    # `continue-on-error: true` was tried at the job level and does not solve
    # this: it flips the workflow RUN to success while the JOB and the PR CHECK
    # both still report failure (verified on run 30768107667). So it does not
    # unblock a required status check, and it does mask genuine CodeQL failures
    # — autobuild breaking, a malformed config, a query error — which is the
    # opposite of what this job is for.
    #
    # Instead we skip the upload entirely and publish the SARIF as a build
    # artifact. Real analysis failures still fail the job, so the check stays
    # honest; it simply no longer depends on a repository setting.
    #
    # Restoring upload (do this — the artifact is a stopgap, not a destination):
    #   1. Settings → Code security → Code scanning → enable.
    #   2. Set `upload: always` below and delete the `output:` line.
    #   3. Delete the "Upload SARIF as artifact" step.
    # Findings then appear in the Security tab and become reviewable in-PR.
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: "/language:javascript"
          output: sarif-results
          upload: never

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 30

  # ESLint Security - Check for security anti-patterns
  eslint-security:
    name: ESLint Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-node

      - name: Run ESLint with security rules
        run: npx eslint .

  # License Compliance - Check dependency licenses
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-node

      - name: Check licenses
        run: npx license-checker --summary --exclude "MIT,Apache-2.0,ISC,BSD-2-Clause,BSD-3-Clause,0BSD"

  # ──────────────────────────────────────────────
  # SUMMARY
  # ──────────────────────────────────────────────

  # PR summary: only depends on jobs that actually run on pull_request events
  security-summary-pr:
    name: Security Summary (PR)
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [npm-audit, secret-scan]
    steps:
      - name: Check results
        run: |
          echo "## Security Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY

  # Dispatch summary: only depends on jobs that actually run on workflow_dispatch events
  # (secret-scan runs on dispatch but not schedule, so it needs its own summary)
  security-summary-dispatch:
    name: Security Summary (Manual)
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [npm-audit, secret-scan, codeql, eslint-security, license-check]
    steps:
      - name: Check results
        run: |
          echo "## Security Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Security | ${{ needs.eslint-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY

  # Scheduled summary: only depends on jobs that actually run on schedule events
  security-summary-scheduled:
    name: Security Summary (Scheduled)
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'schedule'
    needs: [npm-audit, codeql, eslint-security, license-check]
    steps:
      - name: Check results
        run: |
          echo "## Security Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Security | ${{ needs.eslint-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
