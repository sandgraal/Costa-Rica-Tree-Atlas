name: Security Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "middleware.ts"
      - "next.config.ts"
      - "prisma/**"
      - "contentlayer.config.ts"
      - ".github/workflows/security.yml"
      - ".github/actions/**"
  schedule:
    # Full security sweep every Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────
  # LIGHTWEIGHT JOBS — always on PRs; some also run on schedule/manual
  # ──────────────────────────────────────────────

  # NPM Audit - Check for vulnerable dependencies
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-node

      - name: Run npm audit (production, high severity)
        run: npm audit --omit=dev --audit-level=high

  # Secret Scanning - Detect committed secrets
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: HEAD
          extra_args: --only-verified

  # Dependency Review - Analyze dependency changes in PRs
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  # ──────────────────────────────────────────────
  # HEAVY JOBS — schedule + manual only (skip PRs)
  # ──────────────────────────────────────────────

  # CodeQL Analysis - Static Application Security Testing (SAST)
  codeql:
    name: CodeQL Analysis
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  # ESLint Security - Check for security anti-patterns
  eslint-security:
    name: ESLint Security Rules
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-node

      - name: Run ESLint with security rules
        run: npx eslint .

  # License Compliance - Check dependency licenses
  license-check:
    name: License Compliance
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup-node

      - name: Check licenses
        run: npx license-checker --summary --exclude "MIT,Apache-2.0,ISC,BSD-2-Clause,BSD-3-Clause,0BSD"

  # ──────────────────────────────────────────────
  # SUMMARY
  # ──────────────────────────────────────────────

  # PR summary: only depends on jobs that actually run on pull_request events
  security-summary-pr:
    name: Security Summary (PR)
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [npm-audit, secret-scan, dependency-review]
    steps:
      - name: Check results
        run: |
          echo "## Security Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Review | ${{ needs.dependency-review.result }} |" >> $GITHUB_STEP_SUMMARY

  # Dispatch summary: only depends on jobs that actually run on workflow_dispatch events
  # (secret-scan runs on dispatch but not schedule, so it needs its own summary)
  security-summary-dispatch:
    name: Security Summary (Manual)
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [npm-audit, secret-scan, codeql, eslint-security, license-check]
    steps:
      - name: Check results
        run: |
          echo "## Security Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Security | ${{ needs.eslint-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY

  # Scheduled summary: only depends on jobs that actually run on schedule events
  security-summary-scheduled:
    name: Security Summary (Scheduled)
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'schedule'
    needs: [npm-audit, codeql, eslint-security, license-check]
    steps:
      - name: Check results
        run: |
          echo "## Security Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Security | ${{ needs.eslint-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
